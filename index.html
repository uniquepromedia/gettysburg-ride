<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8E4DA">
<title>Gettysburg Auto Tour by Bike</title>
<style>
:root{
  --field:#E8E4DA;      /* park limestone */
  --ink:#1C1A17;
  --bronze:#7A5C2E;     /* monument bronze */
  --union:#2B4C6F;
  --alarm:#9E2B25;
  --quiet:#8C8578;
  --rule:#C9C3B6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--field); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  overflow:hidden; overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{display:flex;flex-direction:column;height:100%}

/* day band ------------------------------------------------------------- */
#days{display:flex;height:16px;flex:0 0 auto;border-bottom:1px solid var(--rule)}
#days div{position:relative;height:100%}
#days .fill{position:absolute;inset:0 auto 0 0;background:currentColor;opacity:.85}
#days .bg{position:absolute;inset:0;background:currentColor;opacity:.18}
#days span{position:absolute;left:6px;top:1px;font-size:10px;font-weight:600;
  letter-spacing:.02em;color:var(--ink);opacity:.65;z-index:2}

/* maneuver ------------------------------------------------------------- */
#man{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:8px 20px;min-height:0}
#arrow{width:132px;height:132px;flex:0 0 auto;color:var(--bronze)}
#arrow svg{width:100%;height:100%;display:block}
#dist{font-size:clamp(56px,19vw,104px);font-weight:800;line-height:.92;
  letter-spacing:-.035em;margin-top:2px}
#dist small{font-size:.32em;font-weight:600;letter-spacing:0;margin-left:.12em;
  color:var(--quiet)}
#road{font-size:clamp(19px,5.6vw,28px);font-weight:600;line-height:1.18;
  text-align:center;margin-top:8px;max-width:22ch}
#then{font-size:15px;color:var(--bronze);font-weight:600;margin-top:7px;
  text-align:center}

/* next stop ------------------------------------------------------------ */
#stop{flex:0 0 auto;display:flex;align-items:baseline;gap:10px;
  padding:11px 20px;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);color:var(--union)}
#stopname{font-size:16px;font-weight:650;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#stopdist{font-size:16px;font-weight:700}

/* route shape ---------------------------------------------------------- */
#shapewrap{flex:1 1 auto;position:relative;min-height:104px}
#shape{position:absolute;inset:0;width:100%;height:100%}

/* footer --------------------------------------------------------------- */
#foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  padding:9px 20px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);font-size:13px;color:var(--quiet)}
#foot b{color:var(--ink);font-weight:700}

/* states --------------------------------------------------------------- */
#veil{position:fixed;inset:0;background:var(--field);z-index:20;display:flex;
  flex-direction:column;justify-content:center;align-items:center;
  padding:34px;text-align:center}
#veil h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#veil p{margin-top:12px;color:var(--quiet);font-size:15px;line-height:1.5;
  max-width:34ch}
#go{margin-top:30px;background:var(--bronze);color:var(--field);border:0;
  font:inherit;font-size:19px;font-weight:700;padding:17px 42px;border-radius:2px;
  cursor:pointer}
#go:active{background:var(--ink)}
#go:focus-visible{outline:3px solid var(--union);outline-offset:3px}
#err{margin-top:18px;color:var(--alarm);font-size:14px;font-weight:600;
  max-width:34ch;line-height:1.45}

body.off #man{background:var(--alarm);color:var(--field)}
body.off #arrow{color:var(--field)}
body.off #dist small{color:rgba(232,228,218,.72)}
body.weak #dist{opacity:.4}
#gps{position:absolute;top:7px;right:11px;width:9px;height:9px;border-radius:50%;
  background:var(--quiet)}
#gps.good{background:var(--union)}
#gps.bad{background:var(--alarm)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="days"></div>
  <div id="man">
    <div id="gps"></div>
    <div id="arrow"></div>
    <div id="dist">--<small>mi</small></div>
    <div id="road">Waiting for GPS</div>
    <div id="then"></div>
  </div>
  <div id="stop"><div id="stopname">--</div><div id="stopdist"></div></div>
  <div id="shapewrap"><canvas id="shape"></canvas></div>
  <div id="foot"><div><b id="done">0.0</b> of 27.62 mi</div><div id="daynow"></div></div>
</div>

<div id="veil">

</div>

<script>
"use strict";
const NAV = JSON.parse(document.getElementById("navdata").textContent);
const CFG = NAV.nav;
const CUES = NAV.cues;
const CUM = NAV.cum_m;
const TOTAL = CUM[CUM.length - 1];
const CHAIN_M = 150;

/* ---- local planar projection. Good to centimetres over a 10km box. ---- */
const REF = NAV.coords[0];
const KX = 111320 * Math.cos(REF[0] * Math.PI / 180);
const KY = 110574;
const XY = NAV.coords.map(c => [(c[1] - REF[1]) * KX, (c[0] - REF[0]) * KY]);

/* ---- chain turns that are too close to announce separately ------------ */
for (let i = 0; i < CUES.length - 1; i++) {
  const a = CUES[i], b = CUES[i + 1];
  if (a.type === "turn" && b.type === "turn" && b.s - a.s < CHAIN_M) {
    a.chain = b;
    b.quiet = true;               // b still fires "now", not early or near
  }
}
/* OSM leaves some park avenues unnamed. "onto the next road" is useless,
   "at the junction" is not. */
for (const c of CUES) {
  if (c.type === "turn" && !c.named) {
    c.early = `In a quarter mile, ${c.turn} at the junction`;
    c.near  = `${cap(c.turn)} at the junction`;
    c.to    = "the junction";
  }
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- arrows ----------------------------------------------------------- */
const ARROWS = {
  "left":        "M62 104 L62 60 Q62 40 42 40 L24 40 M24 40 L38 26 M24 40 L38 54",
  "right":       "M62 104 L62 60 Q62 40 82 40 L100 40 M100 40 L86 26 M100 40 L86 54",
  "sharp left":  "M62 104 L62 70 Q62 48 42 44 L26 40 M26 40 L44 32 M26 40 L36 56",
  "sharp right": "M62 104 L62 70 Q62 48 82 44 L98 40 M98 40 L80 32 M98 40 L88 56",
  "slight left": "M62 104 L62 76 Q62 54 48 40 L38 30 M38 30 L40 46 M38 30 L54 30",
  "slight right":"M62 104 L62 76 Q62 54 76 40 L86 30 M86 30 L84 46 M86 30 L70 30",
  "straight":    "M62 104 L62 32 M62 26 L48 42 M62 26 L76 42",
  "stop":        "M62 24 a20 20 0 1 0 .1 0 M62 52 L62 104",
  "finish":      "M62 104 L62 34 M62 34 L100 34 L100 62 L62 62"
};
function setArrow(kind) {
  const d = ARROWS[kind] || ARROWS.straight;
  document.getElementById("arrow").innerHTML =
    `<svg viewBox="0 0 124 124" aria-hidden="true"><path d="${d}" fill="none"
      stroke="currentColor" stroke-width="13" stroke-linecap="round"
      stroke-linejoin="round"/></svg>`;
}

/* ---- position matching ------------------------------------------------ */
function lowerBound(arr, v) {
  let lo = 0, hi = arr.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; }
  return lo;
}
/* The loop crosses itself 59 times and rides many roads out and back, so
   the nearest point is the wrong answer. A fixed 250m window let GPS noise
   snap onto the return pass at McPherson Ridge and silently skip every cue
   in between. Caught by simulation. Three guards:
   1. The window is anchored on the furthest point reached, not the last
      match, and grows with time since the last good match. After the
      U-turn at a dead end the heading lags for a few seconds; anchoring on
      the last match let position crawl back down the inbound leg until the
      rider was out of reach. A bike cannot be further along than it could
      have ridden, nor more than a few metres behind where it has been.
   2. Road pointing against the rider's recent movement is ignored.
   3. Among close candidates, the one nearest in route distance wins, and
      going backwards costs more than going forwards. */
function match(px, py, hi, dt, dir) {
  let i0, i1;
  if (hi === null) {
    /* First fix. Never search globally: this loop starts and ends in the
       same parking lot, so a global nearest-point search can match the END
       of the route and read cues from the wrong part of the ride. */
    i0 = 0;
    i1 = Math.min(XY.length - 1, lowerBound(CUM, 500) + 1);
  } else {
    const grow = CFG.max_speed_mps * (dt - 1);
    i0 = Math.max(0, lowerBound(CUM, hi - CFG.match_slack_m - grow) - 1);
    i1 = Math.min(XY.length - 1,
                  lowerBound(CUM, hi + CFG.match_slack_m + CFG.max_speed_mps * dt) + 1);
  }
  let best = { d: Infinity, cost: Infinity, s: hi || 0 };
  for (let i = i0; i < i1; i++) {
    const a = XY[i], b = XY[i + 1];
    const vx = b[0] - a[0], vy = b[1] - a[1];
    const L2 = vx * vx + vy * vy;
    if (dir && L2 > 0 && (vx * dir[0] + vy * dir[1]) / Math.sqrt(L2) < -0.7) continue;
    let t = L2 > 0 ? ((px - a[0]) * vx + (py - a[1]) * vy) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = px - (a[0] + t * vx), dy = py - (a[1] + t * vy);
    const d = Math.hypot(dx, dy);
    const s = CUM[i] + t * (CUM[i + 1] - CUM[i]);
    const cost = hi === null ? d : d + (s < hi ? 0.1 * (hi - s) : 0.03 * (s - hi));
    if (cost < best.cost) best = { d, cost, s, i };
  }
  return best;
}
/* Direction of travel: recent fixes against fixes 6 to 9 seconds back.
   Averaging keeps GPS jitter at a standstill from inventing a heading. */
function heading(now) {
  let ax = 0, ay = 0, an = 0, bx = 0, by = 0, bn = 0;
  for (const [t, x, y] of S.trail) {
    const age = now - t;
    if (age <= 3000) { ax += x; ay += y; an++; }
    else if (age >= 6000 && age <= 9000) { bx += x; by += y; bn++; }
  }
  if (!an || !bn) return null;
  const dx = ax / an - bx / bn, dy = ay / an - by / bn, L = Math.hypot(dx, dy);
  return L >= 15 ? [dx / L, dy / L] : null;
}

/* ---- speech ----------------------------------------------------------- */
let voiceReady = false;
function say(text) {
  if (!voiceReady || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02; u.pitch = 1; u.volume = 1; u.lang = "en-US";
  speechSynthesis.speak(u);
}

/* ---- state ------------------------------------------------------------ */
const S = { s: null, hi: null, ci: 0, offCount: 0, lastT: null, trail: [], off: false, started: false, watch: null };
const $ = id => document.getElementById(id);
const mi = m => m / 1609.34;

function fmtDist(m) {
  if (m < 160) return [String(Math.max(0, Math.round(m / 10) * 10)), "ft*"];
  return [mi(m).toFixed(1), "mi"];
}
function setDist(m) {
  const [v, u] = fmtDist(m);
  $("dist").innerHTML = u === "ft*"
    ? `${Math.round(m * 3.28084 / 10) * 10}<small>ft</small>`
    : `${v}<small>${u}</small>`;
}

function nextStopAfter(s) {
  for (const c of CUES) if (c.type === "stop" && c.s > s - 30) return c;
  return null;
}

function render() {
  const cue = CUES[S.ci];
  if (!cue) {
    setArrow("finish");
    $("dist").innerHTML = "0.0<small>mi</small>";
    $("road").textContent = "Back at the parking lot";
    $("then").textContent = "";
    return;
  }
  const d = Math.max(0, cue.s - S.s);
  setDist(d);
  if (cue.type === "stop") {
    setArrow("stop");
    $("road").textContent = cue.stop;
    $("then").textContent = `Day ${cue.day}`;
  } else {
    setArrow(cue.turn);
    $("road").textContent = cue.named ? `onto ${cue.to}` : "at the junction";
    $("then").textContent = cue.chain
      ? `then immediately ${cue.chain.turn}` : "";
  }
  const ns = nextStopAfter(S.s);
  $("stopname").textContent = ns ? ns.stop : "Parking lot";
  $("stopdist").textContent = ns
    ? mi(ns.s - S.s).toFixed(1) + " mi" : mi(TOTAL - S.s).toFixed(1) + " mi";
  $("done").textContent = mi(S.s).toFixed(1);
  $("daynow").textContent = ns ? "July " + ns.day : "";
  drawShape();
}

function announce() {
  while (S.ci < CUES.length && CUES[S.ci].s < S.s - 20) S.ci++;
  const cue = CUES[S.ci];
  if (!cue) return;
  const d = cue.s - S.s;
  if (!cue.quiet && d <= CFG.early_m && !cue._e) {
    cue._e = 1;
    /* A cue that only becomes current inside 220m, right after the one
       before it, would say "in a quarter mile" about a turn that is close.
       The near cue follows within seconds, so let it speak alone. */
    if (d > CFG.near_m + 100) say(cue.chain
      ? `${cue.early}, then immediately ${cue.chain.turn}`
      : cue.early);
  }
  if (!cue.quiet && d <= CFG.near_m && !cue._n) {
    cue._n = 1;
    say(cue.chain
      ? `${cue.near}, then immediately ${cue.chain.turn}` +
        (cue.chain.named ? ` onto ${cue.chain.to}` : "")
      : cue.near);
  }
  if (d <= CFG.at_m && !cue._a) {
    cue._a = 1;
    if (cue.type === "turn") say(cue.at);
    S.ci++;
  }
}

/* ---- route shape ------------------------------------------------------ */
const cvs = $("shape"), ctx = cvs.getContext("2d");
let bounds = null;
function fit() {
  const r = cvs.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cvs.width = r.width * dpr; cvs.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of XY) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  const pad = 14;
  const sc = Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0));
  bounds = { x0, y0, x1, y1, sc, w: r.width, h: r.height,
             ox: (r.width - (x1 - x0) * sc) / 2,
             oy: (r.height - (y1 - y0) * sc) / 2 };
  drawShape();
}
function px(p) {
  return [bounds.ox + (p[0] - bounds.x0) * bounds.sc,
          bounds.h - bounds.oy - (p[1] - bounds.y0) * bounds.sc];
}
function drawShape() {
  if (!bounds) return;
  ctx.clearRect(0, 0, bounds.w, bounds.h);
  const cut = S.s === null ? 0 : lowerBound(CUM, S.s);
  ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = "#C9C3B6";
  ctx.beginPath();
  for (let i = cut; i < XY.length; i++) {
    const q = px(XY[i]); i === cut ? ctx.moveTo(q[0], q[1]) : ctx.lineTo(q[0], q[1]);
  }
  ctx.stroke();
  ctx.strokeStyle = "#7A5C2E"; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i <= cut && i < XY.length; i++) {
    const q = px(XY[i]); i === 0 ? ctx.moveTo(q[0], q[1]) : ctx.lineTo(q[0], q[1]);
  }
  ctx.stroke();
  ctx.fillStyle = "#2B4C6F";
  for (const st of NAV.stops) {
    const q = px([(st.lon - REF[1]) * KX, (st.lat - REF[0]) * KY]);
    ctx.beginPath(); ctx.arc(q[0], q[1], 2.6, 0, 7); ctx.fill();
  }
  if (S.s !== null && cut < XY.length) {
    const q = px(XY[Math.min(cut, XY.length - 1)]);
    ctx.fillStyle = S.off ? "#9E2B25" : "#1C1A17";
    ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, 7); ctx.fill();
    ctx.strokeStyle = "#E8E4DA"; ctx.lineWidth = 2.5; ctx.stroke();
  }
}

/* ---- day band --------------------------------------------------------- */
function buildDays() {
  const el = $("days"), colors = { 1: "#1b7f3b", 2: "#2B4C6F", 3: "#8a1c1c" };
  const marks = [0];
  for (const d of [1, 2, 3]) {
    const last = [...CUES].reverse().find(c => c.type === "stop" && c.day === d);
    marks.push(last ? last.s : marks[marks.length - 1]);
  }
  marks[4] = TOTAL;
  for (const d of [1, 2, 3]) {
    const w = (marks[d] - marks[d - 1]) / TOTAL * 100;
    const div = document.createElement("div");
    div.style.width = w + "%"; div.style.color = colors[d];
    div.innerHTML = `<div class="bg"></div><div class="fill" id="dayfill${d}"
                      style="width:0"></div><span>July ${d}</span>`;
    el.appendChild(div);
  }
  el._marks = marks;
}
function updateDays() {
  const m = $("days")._marks;
  for (const d of [1, 2, 3]) {
    const span = m[d] - m[d - 1];
    const p = span > 0 ? Math.max(0, Math.min(1, (S.s - m[d - 1]) / span)) : 0;
    $("dayfill" + d).style.width = (p * 100) + "%";
  }
}

/* ---- gps -------------------------------------------------------------- */
function onFix(pos) {
  const { latitude: la, longitude: lo, accuracy: acc } = pos.coords;
  const dot = $("gps");
  if (acc > CFG.max_gps_accuracy_m) {
    dot.className = "bad"; document.body.classList.add("weak"); return;
  }
  dot.className = "good"; document.body.classList.remove("weak");

  const px = (lo - REF[1]) * KX, py = (la - REF[0]) * KY;
  const now = typeof pos.timestamp === "number" ? pos.timestamp : Date.now();
  S.trail = S.trail.filter(e => e[0] <= now && now - e[0] <= 9000);
  S.trail.push([now, px, py]);
  /* Time since the last good match, so a GPS gap under tree cover widens
     the search by exactly as far as the rider could have gone. */
  const dt = S.lastT === null ? 1 : Math.max(1, (now - S.lastT) / 1000);
  const m = match(px, py, S.hi, dt, heading(now));
  if (m.d > CFG.off_route_m) {
    S.offCount++;
    if (S.offCount >= CFG.off_route_fixes && !S.off) {
      S.off = true; document.body.classList.add("off");
      $("road").textContent = "Off route";
      say("Off route. Turn around and rejoin the way you came.");
    }
  } else {
    if (S.off) { S.off = false; document.body.classList.remove("off"); say("Back on route"); }
    S.offCount = 0; S.lastT = now;
    /* One fix cannot carry the rider further than they could ride. Caps a
       GPS outlier that would otherwise jump past a cue and skip it. */
    S.s = S.hi === null ? m.s : Math.min(m.s, S.hi + CFG.max_speed_mps * dt + 10);
    /* A match behind the normal window only happens after a gap or an
       off route stretch, where the rider really did rejoin further back. */
    if (S.hi === null || S.s > S.hi || S.s < S.hi - CFG.match_slack_m) S.hi = S.s;
  }
  if (!S.off) { announce(); render(); updateDays(); }
}
function onGpsError(e) {
  $("err").textContent = e.code === 1
    ? "Location permission was denied. Enable it for this site in your browser settings, then reload."
    : "Cannot get a location fix. Step outside and try again.";
  $("veil").style.display = "flex";
}

/* ---- start ------------------------------------------------------------ */
async function start() {
  if (!navigator.geolocation) {
    $("err").textContent = "This browser has no location support.";
    return;
  }
  voiceReady = true;
  say("Navigation ready. " + firstDirection());
  try {
    if ("wakeLock" in navigator) {
      let lock = await navigator.wakeLock.request("screen");
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible")
          try { lock = await navigator.wakeLock.request("screen"); } catch (e) {}
      });
    }
  } catch (e) {}
  S.watch = navigator.geolocation.watchPosition(onFix, onGpsError, {
    enableHighAccuracy: true, maximumAge: 1000, timeout: 15000
  });
  $("veil").style.display = "none";
  S.started = true;
  fit();
}
function firstDirection() {
  const a = NAV.coords[0], b = NAV.coords[Math.min(12, NAV.coords.length - 1)];
  const br = (Math.atan2(
    Math.sin((b[1] - a[1]) * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180),
    Math.cos(a[0] * Math.PI / 180) * Math.sin(b[0] * Math.PI / 180) -
    Math.sin(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) *
    Math.cos((b[1] - a[1]) * Math.PI / 180)) * 180 / Math.PI + 360) % 360;
  const names = ["north", "northeast", "east", "southeast",
                 "south", "southwest", "west", "northwest"];
  return "Head " + names[Math.round(br / 45) % 8] + " out of the lot.";
}

$("go").addEventListener("click", start);
addEventListener("resize", fit);
setArrow("straight");
buildDays();
requestAnimationFrame(fit);
</script>
</body>
</html>
